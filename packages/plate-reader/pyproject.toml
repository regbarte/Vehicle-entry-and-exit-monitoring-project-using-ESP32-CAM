[project]
name = "plate-reader"
version = "0.0.0"
description = "Finds the plate in a photo with a trained model, reads it with Tesseract, and normalizes the text."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.0",
    "opencv-python-headless>=4.13.0.90",
    "pytesseract>=0.3.13",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
