[project]
name = "guardhouse-server"
version = "0.0.0"
description = "FastAPI server: receives camera photos, reads plates, stores entries in MongoDB."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pillow>=13.0.0",
    "plate-reader",
    "pydantic-settings>=2.16.1",
    "pymongo>=4.19.0",
    "python-multipart>=0.0.32",
]

[tool.uv.sources]
plate-reader = { workspace = true }

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
