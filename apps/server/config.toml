# Tunables for the gate. Committed; secrets and the Mongo URI go in .env.

# Seconds continuous mode ignores the same plate after seeing it. A manual Scan
# always creates a detection.
repeat_window_seconds = 30

# Continuous mode watches every active subdivision without a guard click.
continuous_mode_enabled = true

# Delay after each completed attempt. Attempts never overlap at one camera.
continuous_interval_seconds = 1.0

# Resolution the camera's /capture uses: UXGA (1600x1200) or SVGA (800x600).
capture_resolution = "UXGA"

# Maximum time to wait for a full UXGA JPEG. The ESP32-CAM currently needs
# about 7-8 seconds when switching from the VGA live view.
capture_timeout_seconds = 20.0

# Central gate-area brightness below which the LED is used.
flash_dark_threshold = 30.0
flash_settle_seconds = 1.0

# Edits a registered plate may differ from the plate reading and still be offered.
near_match_distance = 1

# Seconds between camera /status checks. Two misses in a row mark it offline.
camera_poll_seconds = 5.0

# Use the fake camera and fake plate reader for development. Set false after
# saving the real camera's http://IP address on the subdivision.
mock_camera = false

# Serial port of the boom barrier Arduino, for example /dev/cu.usbmodem1101.
# Empty uses a fake barrier, so the dashboard works without hardware.
barrier_port = ""
# The subdivision whose gate the barrier belongs to.
barrier_subdivision_id = ""
